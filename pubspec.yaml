name: maktab_app
description: Maktab E Tajushshriah Madrasa Management App (demo build)
publish_to: 'none'
version: 1.4.0+7
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.6.0
  geolocator: ^13.0.0
  flutter_compass: ^0.8.1
  file_picker: ^13.0.0
  csv: ^6.0.0
  excel: ^4.0.6
  http: ^1.2.2
  printing: ^5.13.4
  pdf: ^3.11.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^13.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
dev_dependencies:
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon/app_icon.png
    - assets/surah_yaseen.pdf

# Generates the Android launcher icon (the "app icon" shown on the home
# screen, app drawer and Play Store listing - distinct from assets/logo.png,
# which is the logo shown inside the app's own header/banner) from the
# Maktab-e-Tajushshriah emblem. CI's Android platform folder is scaffolded
# fresh on every build (see .github/workflows/build-apk.yml), so this only
# takes effect there via `dart run flutter_launcher_icons` run right after
# that scaffold step - running it locally (`flutter pub run
# flutter_launcher_icons`) would do nothing since this repo has no android/
# folder checked in to write into.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
