name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Create Android platform files
        run: |
          flutter create --org com.faizeraza --project-name maktab_app --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          sed -i 's/android:label="[^"]*"/android:label="Maktab Madrasa"/' android/app/src/main/AndroidManifest.xml
          # The app now calls Supabase over the network (OTP login, data
          # sync), so the release build must declare internet access
          # explicitly - without this the app would build fine but every
          # network call would silently fail on a real device.
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: maktab-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
