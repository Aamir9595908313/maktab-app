name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # No pinned flutter-version: packages like app_links (pulled in
          # transitively by supabase_flutter for OTP/OAuth deep links) ship
          # Android build files that expect current Flutter Gradle tooling.
          # Pinning to an old release (3.24.5) broke with "Could not get
          # unknown property 'flutter'" / "compileSdkVersion is not
          # specified" - using whatever is current on the stable channel
          # avoids that version skew.
          channel: stable
          cache: true
      - name: Create Android platform files
        run: |
          flutter create --org com.faizeraza --project-name maktab_app --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          sed -i 's/android:label="[^"]*"/android:label="Maktab-E-Tajushshriah"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              xml = f.read()

          # The app calls Supabase over the network (OTP login, data sync),
          # reads GPS location (Qibla direction), and (Sadqa Peti collection)
          # can take an optional evidence photo of the opened donation box,
          # so the release build must declare all of these explicitly -
          # without this the app would build fine but the relevant feature
          # would silently fail on a real device, or the OS would never even
          # show a permission prompt.
          # Prayer-time reminders (flutter_local_notifications): POST_NOTIFICATIONS
          # is the Android 13+ runtime prompt the app requests before
          # scheduling anything; SCHEDULE_EXACT_ALARM lets a reminder fire at
          # the exact prayer-start minute (an inexact alarm could be off by up
          # to 15 minutes); RECEIVE_BOOT_COMPLETED lets the plugin's own
          # built-in boot receiver re-arm already-scheduled reminders after the
          # phone restarts, instead of them silently vanishing.
          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CAMERA",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
          ]
          insert = "".join(f'    <uses-permission android:name="{p}"/>\n' for p in perms if p not in xml)
          if "android.hardware.camera" not in xml:
              insert += '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
          if insert:
              xml = xml.replace("<application", insert + "    <application", 1)

          # Many Android devices/skins have a system-level "Force Dark"
          # feature that auto-inverts colors in apps that don't explicitly
          # support dark mode - this is what was making every text field
          # render with a black background on some phones even though the
          # app's own theme is a normal light theme. Opting out at the
          # manifest level stops the OS from doing that.
          if "forceDarkAllowed" not in xml:
              xml = xml.replace("<application", '<application\n        android:forceDarkAllowed="false"', 1)

          with open(path, "w") as f:
              f.write(xml)
          PYEOF
          python3 - <<'PYEOF'
          import os

          # flutter_local_notifications uses java.time APIs that only exist
          # natively on Android 8+ (API 26) - on anything older the app's
          # own compileOptions already target Java 11 bytecode, but the
          # Android Gradle Plugin still needs "core library desugaring"
          # explicitly turned on before it will let a dependency that uses
          # those APIs into a release build at all (it refuses the build
          # with checkReleaseAarMetadata otherwise, regardless of minSdk).
          # Flutter's own scaffold template doesn't enable this by default,
          # so it has to be patched in here. Handles whichever build file
          # format this Flutter version scaffolds (Kotlin DSL is current,
          # Groovy is the older format some versions still generate).
          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"
          path = kts_path if os.path.exists(kts_path) else groovy_path
          is_kts = path == kts_path

          with open(path) as f:
              src = f.read()

          if "coreLibraryDesugaring" not in src:
              if is_kts:
                  if "isCoreLibraryDesugaringEnabled" not in src:
                      src = src.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  src += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.2")\n}\n'
              else:
                  if "coreLibraryDesugaringEnabled" not in src:
                      src = src.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                  src += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'\n}\n"

          # Flutter's own scaffold template leaves the release buildType
          # with no R8 shrinking at all - minifyEnabled/shrinkResources are
          # off by default, so every plugin's unused Java/Kotlin classes
          # and unused Android resources ship in the APK untouched. Every
          # bundled plugin here (supabase_flutter, geolocator, image_picker,
          # file_picker, flutter_local_notifications, printing, share_plus,
          # ...) already ships its own consumer proguard rules, so turning
          # this on is the normal, low-risk default - not something those
          # plugins need extra rules written for.
          if is_kts:
              if "isMinifyEnabled" not in src:
                  src = src.replace(
                      "release {",
                      "release {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"))",
                      1,
                  )
          else:
              if "minifyEnabled" not in src:
                  src = src.replace(
                      "release {",
                      "release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')",
                      1,
                  )

          with open(path, "w") as f:
              f.write(src)
          PYEOF
      - name: Decode release signing keystore (if configured)
        # Play Store refuses an app signed with Flutter's public debug
        # key, and every future update must be signed with the SAME key -
        # so this has to be a real keystore kept outside the repo, fed in
        # as a GitHub secret, not generated fresh on every run like the
        # android/ folder itself. Until these secrets are added (repo
        # Settings > Secrets and variables > Actions), this step is a
        # no-op and every build stays exactly as it was before (debug-
        # signed) - nothing here can break an existing build.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Release signing configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set - building debug-signed as before."
          fi
      - name: Wire up release signing in Gradle (if configured)
        run: |
          python3 - <<'PYEOF'
          import os

          # Mirrors the guard in key.properties' own absence: if the
          # secrets above weren't set, key.properties doesn't exist, and
          # the release buildType keeps using the debug signingConfig
          # (Flutter's scaffold default) exactly as every build before
          # this did. Once key.properties exists, release builds (both
          # the per-ABI APKs and the App Bundle) are signed with the real
          # upload key instead.
          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"
          path = kts_path if os.path.exists(kts_path) else groovy_path
          is_kts = path == kts_path

          with open(path) as f:
              src = f.read()

          if is_kts:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'val keystoreProperties = Properties()\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              if "keystorePropertiesFile" not in src:
                  src = header + src
              if "signingConfigs {" not in src:
                  src = src.replace(
                      "android {",
                      'android {\n    signingConfigs {\n        create("release") {\n'
                      '            if (keystorePropertiesFile.exists()) {\n'
                      '                keyAlias = keystoreProperties["keyAlias"] as String\n'
                      '                keyPassword = keystoreProperties["keyPassword"] as String\n'
                      '                storeFile = file(keystoreProperties["storeFile"] as String)\n'
                      '                storePassword = keystoreProperties["storePassword"] as String\n'
                      '            }\n        }\n    }',
                      1,
                  )
              if "signingConfig = signingConfigs" not in src:
                  src = src.replace(
                      "release {",
                      'release {\n            signingConfig = if (keystorePropertiesFile.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")',
                      1,
                  )
          else:
              header = (
                  'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'def keystoreProperties = new Properties()\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              if "keystorePropertiesFile" not in src:
                  src = header + src
              if "signingConfigs {" not in src:
                  src = src.replace(
                      "android {",
                      'android {\n    signingConfigs {\n        release {\n'
                      '            if (keystorePropertiesFile.exists()) {\n'
                      "                keyAlias keystoreProperties['keyAlias']\n"
                      "                keyPassword keystoreProperties['keyPassword']\n"
                      "                storeFile file(keystoreProperties['storeFile'])\n"
                      "                storePassword keystoreProperties['storePassword']\n"
                      '            }\n        }\n    }',
                      1,
                  )
              if "signingConfig signingConfigs" not in src:
                  src = src.replace(
                      "release {",
                      "release {\n            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug",
                      1,
                  )

          with open(path, "w") as f:
              f.write(src)
          PYEOF
      - name: Generate app launcher icon
        # The android/ folder above is freshly scaffolded on every run (it's
        # gitignored, not checked in), so it always starts with Flutter's
        # stock default icon - this has to regenerate the real one
        # (assets/icon/app_icon.png, the Maktab-e-Tajushshriah emblem, per
        # pubspec.yaml's flutter_launcher_icons config) every single build,
        # right after the android/ folder exists and before it gets built.
        # `flutter pub get` first because flutter_launcher_icons is a dev
        # dependency - "Build release APK" below does its own pub get too,
        # but that happens after this step and would be too late.
        run: |
          flutter pub get
          dart run flutter_launcher_icons -f pubspec.yaml
      - name: Build release APK
        id: build
        continue-on-error: true
        # pub get is run as part of this same step (not a separate one) so
        # a dependency-resolution failure also lands in build-log.txt and
        # gets published the same way a compile failure does - a plain
        # separate `flutter pub get` step has no log capture at all, and
        # its failure output is only reachable through the Actions log
        # viewer's own storage, which isn't reachable from every network.
        # --split-per-abi: one APK per CPU architecture (arm64-v8a,
        # armeabi-v7a, x86_64) instead of one "universal" APK carrying all
        # three copies of every native library. Same Dart/Flutter code and
        # features in every one of them - this only removes native code
        # for CPU types the installing phone can't use anyway. arm64-v8a
        # covers virtually every real Android phone sold since ~2017;
        # armeabi-v7a is kept too for older/budget devices, x86_64 for
        # emulators. set -o pipefail: without it, `| tee` makes this step
        # exit 0 (tee's own exit code) even when flutter build fails, which
        # is exactly what happened on an earlier run - "succeeded" with no
        # APK produced. --obfuscate --split-debug-info=<dir>: Flutter's own
        # documented app-size reduction - without it, Dart debug/symbol
        # info for crash-stack-trace purposes is bundled straight into the
        # APK; this writes it to build/app/outputs/symbols instead (not
        # uploaded anywhere here - fine, since this project has no crash
        # reporting set up to symbolicate with it yet) and ships a smaller,
        # obfuscated AOT snapshot in the APK itself.
        run: |
          set -o pipefail
          (flutter pub get && flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols) 2>&1 | tee build-log.txt
      - name: Build release App Bundle (.aab, for Play Store)
        id: buildaab
        if: steps.build.outcome == 'success'
        continue-on-error: true
        # Play Store requires an .aab for a new app, not the .apk files
        # above (those stay as-is, for GitHub-release sideloading/testing).
        # Not split-per-abi: Play itself splits a bundle by ABI/density/
        # language per device at install time, so the bundle carries one
        # copy of everything instead.
        run: |
          set -o pipefail
          flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols 2>&1 | tee -a build-log.txt
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: maktab-app-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Publish App Bundle to a GitHub Release
        # Same reasoning as the APK release below - a Release asset is
        # reachable from anywhere, an Actions artifact isn't always.
        # This is the file to actually upload to Play Console.
        if: steps.buildaab.outcome == 'success'
        run: |
          gh release delete latest-aab --yes || true
          git tag -f latest-aab
          git push -f origin latest-aab
          gh release create latest-aab \
            build/app/outputs/bundle/release/app-release.aab \
            --title "Maktab App (latest Play Store bundle)" \
            --notes "Auto-built from commit ${{ github.sha }}. Upload app-release.aab to Play Console > Production/Testing > Create release." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish APK to a GitHub Release
        # Build artifacts (actions/upload-artifact) are only downloadable
        # from Azure Blob Storage, which some networks/sandboxes can't
        # reach. A Release asset is served straight from github.com, so
        # it's downloadable from anywhere. "latest-apk" is reused/updated
        # on every push rather than piling up a new release each time.
        # arm64-v8a is uploaded as "maktab-app.apk" (the plain, expected
        # filename) since that's the right one for virtually every real
        # phone; the armeabi-v7a (older devices) and x86_64 (emulator)
        # builds are uploaded alongside it under their own names for the
        # rare device that needs one of those instead.
        if: steps.build.outcome == 'success'
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk maktab-app.apk
          gh release delete latest-apk --yes || true
          git tag -f latest-apk
          git push -f origin latest-apk
          gh release create latest-apk \
            maktab-app.apk \
            app-armeabi-v7a-release.apk \
            app-x86_64-release.apk \
            --title "Maktab App (latest build)" \
            --notes "Auto-built from commit ${{ github.sha }}. maktab-app.apk (arm64) is the right one for virtually every real phone; the armeabi-v7a/x86_64 files are for older devices/emulators." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish build log on failure (same reason - Release asset, not an Actions artifact)
        if: steps.build.outcome == 'failure'
        run: |
          gh release delete build-log --yes || true
          git tag -f build-log
          git push -f origin build-log
          gh release create build-log build-log.txt \
            --title "Build log (failed build)" \
            --notes "Failed build log from commit ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
